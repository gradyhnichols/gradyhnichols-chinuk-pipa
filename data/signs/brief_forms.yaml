- id: ST
  kind: overlap_initialism
  chinook: 'sahali taii (LJ spelling: Sahale Taye)'
  expansion: God ('the above chief')
  construction: S_semicircle + overlap + T
  unicode:
  - U+1BC1C
  - U+1BCA1
  - U+1BC03
  label: VERIFIED
  sources:
  - 'LJ1898 p.13 (Notes: ''S. T., abbreviation for Sahale Taye - the above chief, God'', Latin type)'
  - R2011 p.49 (ex.26b)
  - 'BLOG 2020-08-18 (KW #121, Oct 1894, p.170, Le Jeune''s own note ''ST abbreviated from sahali taii'')'
  - GUIDE2024 p.1
  - CORBETT keyboard
  - L2/09-184 (KMW51 p.3, KMW45 p.4)
  confidence: high
  notes: The most frequent brief form; Robertson's own examples spell it ST. In the Rawnd render the S cup is crossed by
    the T dash (COMPUTED). Blog 2017-12-17 records an anonymous manuscript that writes bare S for sahali, an extension not
    found in Le Jeune.
  attested_by_le_jeune: 'yes'
