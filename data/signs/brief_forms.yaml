- claim: No Le Jeune list of brief forms for ordinary Chinook words (kopa, pi, naika, nsaika ...) was found.
  label: VERIFIED (negative result over the sources read)
  evidence: 'LJ1924 contents list cites ''About abbreviations, page 196, Sept. 1896'' (that issue has not been checked here); R2011 p.49 lists only the five
    initialisms in ex.26 plus the likalisti sign; a text search of the Robertson blog posts read for this project (COMPUTED)
    finds only the month/place chart (2016-03-15), the likalisti sign, LiksK, ''L ShK it MI'' and the ST/ShK/ShB/SShB examples,
    plus two manuscript abbreviations by other writers (SI for sahali ilihi, T-S in a Stolo hymn book) that are not Le Jeune''s.'
  residual_risk: A systematic brief-form lesson may exist in an uncatalogued issue; the Rudiments 1898 vocabulary pages were read for data/gt, and no brief forms were noticed there.
