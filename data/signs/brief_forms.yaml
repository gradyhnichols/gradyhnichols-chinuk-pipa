# chinuk-pipa brief forms, abbreviations and logograms used by Le Jeune (and, where marked, by other writers).
# Generated 2026-10-07. attested_by_le_jeune: yes | unknown. label = evidence status (see legend in signs.yaml).
# Overlap abbreviations are encoded with U+1BCA1 SHORTHAND FORMAT CONTINUING OVERLAP between the letters.
# unicode: null where the letters were not seen or the form is not representable; nested lists mean several sequences.
schema_version: 1
generated: '2026-10-07'
legend:
  VERIFIED: The compiling AI agent read or looked at the passage/image in the cited source (not yet confirmed by a person).
  COMPUTED: Measured or rendered by code (Rawnd Musmus Duployan font via fontTools; Pillow + Raqm).
  INFERRED: The compiling agent's own reading or hypothesis; the source does not say it.
  UNVERIFIED: Reported by a secondary source (font docs, keyboard help, proposal caption); the primary page was not seen.
source_keys:
  R2011: Robertson, D. D. 2011. Kamloops Chinuk Wawa, Chinuk pipa, and the vitality of pidgins. PhD diss., Univ. of Victoria.
    Printed page numbers (PDF page = printed + 18). Sec. 2.3 = pp.37-51; Table 2 = p.38.
  LJ1924: 'Le Jeune, J.-M.-R. 1924. Chinook Rudiments. Kamloops. Printed p.5: ''Phonetic Alphabet'', ''Pronunciation''.
    Internet Archive Ayer_PM843_L45_1924 (Newberry Library).'
  LJ1898: Le Jeune, J.-M.-R. 1898. Chinook and Shorthand Rudiments. Kamloops. Internet Archive cihm_15465 (CIHM microfilm).
    p.2 'Phonetic Alphabet', p.5 'Phonetic Syllables', p.13 'Notes and Explanations'.
  LJ1896: '[Le Jeune] 1896. The Wawa Shorthand Instructor, or, The Duployan stenography adapted to English. Kamloops.
    Internet Archive wawashorthandins00leje (also cihm_15507). Lessons XV-XVII.'
  UNI-NL: Unicode Standard NamesList.txt / chart U1BC00 (Duployan, Unicode 7.0 to 18.0 unchanged). Names and the '* Chinook
    ...' annotations.
  L2/09-184: Anderson, V. 2009-05-03. Proposal to include Chinook Pipa in Unicode/ISO-10646. UTC L2/09-184.
  L2/09-364: Anderson, V. 2009-10-26. Initial proposal to include Duployean Shorthand and Chinook writing. L2/09-364 (numerals
    paragraph).
  L2/10-026: Anderson, V. 2010. Proposal to include Duployan script and Shorthand Format Controls (Chinook numbers paragraph).
  L2/10-159: Anderson, V. 2010-05-03. Complete proposal with documentation, Examples 1-7 (documentation from Chinook Rudiments
    p.5 and Kamloops Wawa).
  L2/12-329: Anderson, V. 2012-10-15. Duployan Letter Kk representative glyph change. L2/12-329.
  UTN37: Unicode Technical Note 37, Duployan rendering model.
  CORBETT: 'Corbett, D. Rawnd Musmus Duployan font (font files SIL OFL 1.1; build code Apache-2.0): user-documentation.md, variants.md; keyboard index.html
    and transliterate.js at dscorbett.github.io/duployan-test.'
  GUIDE2024: Chinuk Pipa Guide (Kaltash Wawa), 2024, p.1 (vowels, consonants, special characters, abbreviations, circle
    vowels).
  BLOG: Robertson, D. D., chinookjargon.com posts (dated individually in the entry).
  RAWND: 'Measured or rendered here: RawndMusmusDuployan-Regular.otf, fontTools bounding boxes and Pillow+Raqm renders.'
