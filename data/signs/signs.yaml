    relative_length: '1.15'
    rawnd_bbox_units: 358x569 (stroke 70; centreline 576)
  joining: 'Next letter attaches at the lower-left end. After K, an L must be ''jogged'' rightward (about ENE) to avoid
    retracing K, which makes kl look like kt (R2011 pp.43-44). Vowels adjoining K must lie rightward (ka: circle at the
    bottom, right; ak: circle at the top, left; LJ1898 p.5). Never joined to another K (circle a: kak, numeral 44).'
